<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADVM Technology | Apresentação da identidade visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg);color:var(--fg);--t:cubic-bezier(.16,1,.3,1)}
#bgc{position:absolute;inset:0;width:100%;height:100%}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 88% 12%,var(--glow),transparent 70%);opacity:.9}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
.f1{font-family:var(--f1)}.ac{color:var(--ac)}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s,transform .7s,filter .7s;transform:scale(1.04);filter:blur(10px)}
.scene.active{opacity:1;visibility:visible;transform:none;filter:none}
.scene.out{opacity:0;visibility:visible;transform:scale(.96) translateY(-30px);filter:blur(12px)}
[data-at]{opacity:0;transform:translateY(46px) scale(.97);transition:opacity .8s var(--t),transform .8s var(--t)}
[data-at].show{opacity:1;transform:none}
.kick{position:absolute;left:120px;top:90px;font-size:22px;color:var(--ac);display:flex;gap:18px;align-items:center}
.kick i{width:60px;height:2px;background:var(--ac);display:block}
h2.t{position:absolute;left:120px;top:140px;font-family:var(--f1);font-weight:var(--wmw);font-size:92px;letter-spacing:-.035em;line-height:1;max-width:1500px}
.lock{display:flex;align-items:center;gap:28px}.lock.v{flex-direction:column;gap:20px;text-align:center}
.wm{display:grid;line-height:1}.lock.v .wm{justify-items:center}
.wm b{font-family:var(--f1);font-weight:var(--wmw);letter-spacing:var(--wmls)}.wm small{font-family:var(--f2);letter-spacing:var(--subls);margin-top:.22em;font-size:.34em;font-weight:400;text-transform:uppercase}
/* marca animada */
.m-ring{stroke-dasharray:1;stroke-dashoffset:1}
.m-fill{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.5)}
.active .m-ring{animation:draw 1.5s .25s cubic-bezier(.6,0,.2,1) forwards}
.active .m-fill{animation:pop .9s 1.1s cubic-bezier(.2,1.5,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{opacity:1;transform:none}}
/* S1 */
#s1 .center{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:50px}
#s1 .wm b{font-size:190px;display:flex}#s1 .wm b span{display:inline-block;opacity:0;transform:translateY(120%)}
#s1 .wmwrap{overflow:hidden;padding:0 6px}
#s1 .wm small{font-size:44px}
#s1.s1 .wm b span{opacity:1;transform:none;transition:all .9s var(--t)}
#s1 .tag{font-size:26px;color:var(--ac);margin-top:12px}
.ping{position:absolute;border:2px solid var(--ac);border-radius:50%;opacity:0}
.active .ping{animation:ping 3s 1.4s infinite}.ping.b{animation-delay:2.4s!important}
@keyframes ping{0%{opacity:.7;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}
/* S2 */
.old{position:absolute;left:140px;top:300px;width:700px;height:520px;border:2px dashed #ffffff30;border-radius:24px;display:grid;place-content:center;justify-items:center;gap:20px}
.old .lab{position:absolute;left:24px;top:18px;font-size:18px;color:#ff6b6b}
.old .gl{font-family:'Space Grotesk';font-weight:700;font-size:170px;letter-spacing:.06em;color:#9aa09a;filter:blur(2.2px);position:relative}
.active .old .gl{animation:glitch 2.2s infinite steps(1)}
@keyframes glitch{0%,100%{transform:none;text-shadow:none}10%{transform:translate(-8px,2px);text-shadow:8px 0 #f0f,-8px 0 #0ff}12%{transform:translate(6px,-3px)}14%{transform:none;text-shadow:none}60%{transform:translate(4px,0);text-shadow:-6px 0 #f0f,6px 0 #0ff}62%{transform:none;text-shadow:none}}
.old p{font-size:22px;color:#8a8f8a}
.probs{position:absolute;left:1000px;top:300px;display:grid;gap:34px;width:800px}
.pr{display:flex;align-items:center;gap:30px;font-family:var(--f1);font-size:54px;font-weight:var(--wmw);letter-spacing:-.02em}
.pr i{flex:none;width:76px;height:76px;border-radius:50%;background:#ff4a4a22;border:2px solid #ff4a4a;display:grid;place-items:center;color:#ff4a4a;font-style:normal;font-size:44px}
/* S3 */
.trip{position:absolute;left:120px;right:120px;top:400px;display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.tc{border:2px solid #ffffff18;border-radius:28px;padding:50px;background:#ffffff08;min-height:480px;display:grid;align-content:start;gap:24px}
.tc svg{width:150px;height:150px}.tc h3{font-family:var(--f1);font-size:78px;letter-spacing:-.03em;font-weight:var(--wmw);color:var(--ac)}.tc p{font-size:32px;opacity:.75;line-height:1.35}
.ripple{transform-box:fill-box;transform-origin:center;animation:rip 2.2s infinite}.ripple.r2{animation-delay:.7s}.ripple.r3{animation-delay:1.4s}
@keyframes rip{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.3)}}
.scan{animation:scan 2.4s ease-in-out infinite alternate}@keyframes scan{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.2s infinite}@keyframes beat{50%{transform:scale(1.12)}}
/* S4 */
.symwrap{position:absolute;left:180px;top:240px;width:720px;height:720px}
.symwrap .guide{position:absolute;inset:-60px;border:2px dashed #ffffff22;border-radius:50%}
.symwrap .cross-h,.symwrap .cross-v{position:absolute;background:#ffffff18}.cross-h{left:-100px;right:-100px;top:50%;height:2px}.cross-v{top:-100px;bottom:-100px;left:50%;width:2px}
.lbl{position:absolute;display:flex;align-items:center;gap:20px;font-size:26px}
.lbl i{display:block;height:2px;background:var(--ac)}.lbl b{font-family:var(--f1);font-size:64px;font-weight:var(--wmw);letter-spacing:-.02em}
.lbl span{display:block;opacity:.7;font-size:28px;max-width:520px;margin-top:6px;font-family:var(--f2)}
/* S5 */
.logos{position:absolute;left:120px;right:120px;top:330px;display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:36px}
.lp{height:560px;border-radius:28px;display:grid;place-content:center;justify-items:center;gap:20px;border:2px solid #ffffff14}
.lp .lock .wm{font-size:60px}.lp.v .wm{font-size:64px}
.lp small.cap{position:absolute;bottom:20px;font-size:18px;opacity:.55}
.lp{position:relative}
/* S6 */
.bars{position:absolute;left:120px;right:120px;top:300px;bottom:110px;display:grid;grid-template-columns:repeat(5,1fr);gap:26px}
.bar{border-radius:28px;position:relative;overflow:hidden;display:grid;align-content:end;padding:36px;border:2px solid #ffffff22}
.bar{transform-origin:bottom;transform:scaleY(.12);opacity:.2;transition:transform .9s var(--t),opacity .9s}
.bar.show{transform:none;opacity:1}
.bar b{font-family:var(--f1);font-size:50px;letter-spacing:-.02em;font-weight:var(--wmw)}.bar .hx{font-size:26px;margin-top:8px}.bar p{font-size:24px;margin-top:6px;opacity:.8}
/* S7 */
.tyL{position:absolute;left:120px;top:330px;width:820px}.tyR{position:absolute;left:1000px;top:330px;width:800px}
.big{font-size:360px;line-height:.9;letter-spacing:-.04em}.tyL .nm,.tyR .nm{font-size:24px;color:var(--ac);margin-bottom:14px}
.sam{font-size:60px;line-height:1.12;letter-spacing:-.025em;margin-top:30px;font-family:var(--f1);font-weight:var(--wmw)}
.sam2{font-size:34px;line-height:1.45;margin-top:30px;opacity:.8;font-family:var(--f2)}
.cur::after{content:"";display:inline-block;width:.07em;height:.9em;background:var(--ac);margin-left:8px;vertical-align:-.08em;animation:blink 1s infinite}@keyframes blink{50%{opacity:0}}
/* S8 */
.phone{position:absolute;left:160px;top:250px;width:420px;height:760px;border-radius:56px;border:3px solid #ffffff30;background:var(--bg2);padding:34px 28px;overflow:hidden;box-shadow:0 40px 90px #0009}
.phone .pa{display:flex;align-items:center;gap:22px}.phone .av{width:118px;height:118px;border-radius:50%;background:var(--bg);display:grid;place-items:center;border:2px solid var(--ac)}
.phone .st{display:flex;gap:22px;text-align:center;font-size:19px}.phone .st b{display:block;font-size:26px}
.phone h5{font-size:24px;margin:18px 0 4px}.phone p{font-size:19px;opacity:.7;line-height:1.4}
.phone .gr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:22px}.phone .gr div{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-family:var(--f1);font-weight:var(--wmw);font-size:15px;line-height:1.05;padding:8px;text-align:center}
.cards{position:absolute;left:700px;top:260px;width:560px;height:620px}
.bc{position:absolute;width:520px;height:300px;border-radius:20px;padding:34px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 30px 70px #0009;border:2px solid #ffffff18}
.bc .nm{font-family:var(--f1);font-weight:var(--wmw);font-size:32px}.bc .ct{font-size:20px;opacity:.85;line-height:1.5}
.bc.a{left:0;top:0;transform:rotate(-6deg)}.bc.b{left:70px;top:320px;transform:rotate(4deg)}
[data-at].bc.a.show{transform:rotate(-6deg)}[data-at].bc.b.show{transform:rotate(4deg)}
.site{position:absolute;left:1320px;top:290px;width:500px;height:560px;border-radius:24px;border:2px solid #ffffff22;background:var(--bg);overflow:hidden;box-shadow:0 40px 90px #0009}
.site .sb{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #ffffff14;font-size:15px}
.site h6{font-family:var(--f1);font-weight:var(--wmw);font-size:40px;line-height:1.04;letter-spacing:-.03em;padding:28px 24px 10px}
.site .wallm{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 24px}.site .wallm i{aspect-ratio:16/9;border-radius:8px;background:linear-gradient(135deg,#0f1a2b,#18283e);border:1px solid #ffffff18;position:relative;overflow:hidden}
.site .wallm i::after{content:"";position:absolute;left:8px;top:8px;width:8px;height:8px;border-radius:50%;background:#ff3b3b;animation:blink 1.2s infinite}
.site .wallm i::before{content:"";position:absolute;left:0;right:0;height:3px;background:var(--ac);opacity:.35;animation:sw 2.6s linear infinite}@keyframes sw{from{top:-4px}to{top:100%}}
.site .bt{margin:14px 24px;display:inline-block;padding:14px 26px;border-radius:999px;font-weight:600;font-size:18px}
/* S9 */
.clear{position:absolute;left:150px;top:300px;width:760px;height:560px;display:grid;place-content:center;border:2px dashed var(--ac);border-radius:16px;background:#ffffff06}
.clear em{position:absolute;font-style:normal;font-size:20px;color:var(--ac)}
.clear .bx{position:absolute;inset:60px;border:1px solid #ffffff30}
.donts{position:absolute;left:1000px;top:300px;width:790px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px}
.dn{height:300px;border-radius:22px;border:2px solid #ff4a4a55;background:#ffffff08;position:relative;display:grid;place-content:center;overflow:hidden}
.dn::after{content:"✕";position:absolute;right:14px;top:8px;color:#ff4a4a;font-size:40px}
.dn p{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:19px;opacity:.75}
.seal{position:absolute;left:1000px;top:660px;width:790px;padding:26px 30px;border-radius:22px;border:2px solid var(--ac);font-size:28px;line-height:1.4;display:flex;gap:26px;align-items:center}
.seal i{flex:none;width:92px;height:92px;border:2px dashed var(--ac);border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:16px;text-align:center;color:var(--ac)}
/* S10 */
.line{position:absolute;left:180px;right:180px;top:520px;height:6px;background:#ffffff18;border-radius:9px}
.line i{position:absolute;left:0;top:0;height:100%;width:0;background:var(--ac);border-radius:9px;transition:width 1.4s var(--t)}
.steps{position:absolute;left:120px;right:120px;top:420px;display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.stp{text-align:center;display:grid;gap:22px;justify-items:center;align-content:start}
.stp .nn{width:120px;height:120px;border-radius:50%;background:var(--bg);border:4px solid var(--ac);display:grid;place-items:center;font-family:var(--f1);font-weight:var(--wmw);font-size:54px;color:var(--ac)}
.stp h4{font-family:var(--f1);font-size:38px;font-weight:var(--wmw);letter-spacing:-.02em;margin-top:70px}.stp p{font-size:24px;opacity:.7;max-width:300px}
/* S11 */
#s11 .center{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:40px;text-align:center}
#s11 .wm b{font-size:150px}#s11 .wm small{font-size:36px}
#s11 h2{font-family:var(--f1);font-weight:var(--wmw);font-size:80px;letter-spacing:-.03em;line-height:1.05}
/* UI */
#sub{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);max-width:1500px;text-align:center;font-size:40px;line-height:1.3;padding:16px 34px;border-radius:20px;background:#000a;backdrop-filter:blur(8px);opacity:0;transition:opacity .4s;z-index:5;font-weight:500}
#sub.on{opacity:1}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 22px;display:flex;align-items:center;gap:14px;background:linear-gradient(transparent,#000c);opacity:0;transition:opacity .3s}
body.ui #ui,#ui:hover{opacity:1}
#ui button{width:42px;height:42px;border-radius:50%;background:#ffffff1f;font-size:17px;display:grid;place-items:center}#ui button:hover{background:#ffffff40}
#prog{flex:1;display:flex;gap:5px;height:8px}#prog i{flex:1;background:#ffffff30;border-radius:4px;position:relative;overflow:hidden;cursor:pointer}#prog i b{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff}
#cnt{font-size:14px;opacity:.8;min-width:60px;text-align:right;font-family:'JetBrains Mono',monospace}
#start{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:26px;text-align:center;background:radial-gradient(ellipse at 70% 20%,#2a3320,#0b0d0a 70%);padding:30px}
#start h1{font-family:'Space Grotesk';font-size:clamp(2rem,5.5vw,4.4rem);letter-spacing:-.04em;line-height:1.05;max-width:16ch}
#start p{color:#a9b09c;max-width:56ch}
.pills{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.pills button{padding:10px 20px;border-radius:999px;border:1px solid #ffffff40;font-size:.95rem}.pills button.on{background:#fff;color:#000;border-color:#fff}
#go{padding:18px 40px;border-radius:999px;background:#dbe88f;color:#14180d;font-weight:700;font-size:1.15rem}#go:hover{box-shadow:0 0 40px #dbe88f66}
.hint{font-size:.82rem;color:#7f8872}
</style>
</head>
<body>
<div id="start">
  <p class="hint" style="letter-spacing:.14em;text-transform:uppercase">ADVM Technology · Apresentação</p>
  <h1>A nova identidade visual</h1>
  <p>Cerca de 3 minutos, com narração. Escolha a direção que quer mostrar e aperte iniciar. Ligue o som do aparelho.</p>
  <div class="pills" id="pills"></div>
  <button id="go">▶ Iniciar apresentação</button>
  <p class="hint" id="vhint">Narração em português do Brasil, gerada por IA.</p>
</div>
<div id="stage" style="display:none">
  <canvas id="bgc" width="1920" height="1080"></canvas><div class="glow"></div>
  <div id="scenes"></div>
  <div id="sub"></div>
</div>
<div id="ui"><button id="bPrev" aria-label="Anterior">⏮</button><button id="bPlay" aria-label="Pausar">⏸</button><button id="bNext" aria-label="Próxima">⏭</button><div id="prog"></div><span id="cnt"></span><button id="bMute" aria-label="Som">🔊</button><button id="bFull" aria-label="Tela cheia">⛶</button></div>

<script>
/* ===== TEMAS (as 3 direções) ===== */
const P_A = "M42 22H58L80 64L75 70H25L20 64ZM50 41L56 53H44Z", P_SH = "M50 4L90 18V50C90 74 73 90 50 97C27 90 10 74 10 50V18Z";
const T = {
 nucleo: { name: "Núcleo", tag: "tecnologia e precisão", m: "a", bg: "#101210", bg2: "#171b14", glow: "#4a5640", fg: "#eef2e4", ac: "#dbe88f", ac2: "#dbe88f", on: "#14180d", light: "#f1f4e6", lfg: "#1a2012", f1: "'Space Grotesk',sans-serif", f2: "'JetBrains Mono',monospace", fn1: "Space Grotesk", fn2: "JetBrains Mono", wmw: 700, wmls: ".14em", subls: ".42em",
   sym: ["O círculo é a lente: atenção constante.", "O A é a inicial da marca, uma base sólida e estável."], lb: [["LENTE", "atenção constante"], ["BASE", "a inicial, firme e estável"]],
   pal: [["Verde-limão", "#dbe88f", "para destaque e ação", "#14180d"], ["Oliva", "#5e694f", "para dar profundidade", "#eef2e4"], ["Grafite", "#101210", "como base de tudo", "#eef2e4"], ["Névoa", "#eef2e4", "para leitura confortável", "#101210"], ["Vermelho", "#ff4a4a", "só para alertas", "#101210"]] },
 confianca: { name: "Confiança", tag: "corporativa e institucional", m: "shield", bg: "#0a1a2f", bg2: "#10253f", glow: "#17508f", fg: "#f4f6f8", ac: "#3d9bff", ac2: "#0a1a2f", on: "#04101f", light: "#f4f6f8", lfg: "#0a1a2f", f1: "'Sora',sans-serif", f2: "'Inter',sans-serif", fn1: "Sora", fn2: "Inter", wmw: 700, wmls: ".1em", subls: ".38em",
   sym: ["O escudo é proteção: a promessa da marca.", "O A, no centro, é a inicial: uma base sólida."], lb: [["ESCUDO", "proteção como promessa"], ["BASE", "a inicial, firme e estável"]],
   pal: [["Azul-marinho", "#0a1a2f", "como base e seriedade", "#f4f6f8"], ["Azul-sinal", "#3d9bff", "para destaque e ação", "#04101f"], ["Aço", "#8aa0b8", "para textos de apoio", "#04101f"], ["Névoa", "#f4f6f8", "para fundos claros", "#0a1a2f"], ["Âmbar", "#ffb020", "só para alertas", "#04101f"]] },
 iris: { name: "Íris", tag: "sóbria e premium", m: "iris", bg: "#141312", bg2: "#1c1a18", glow: "#5a4a2a", fg: "#f3efe6", ac: "#c9ad72", ac2: "#c9ad72", on: "#141312", light: "#f3efe6", lfg: "#141312", f1: "'Outfit',sans-serif", f2: "'Inter',sans-serif", fn1: "Outfit", fn2: "Inter", wmw: 500, wmls: ".3em", subls: ".5em",
   sym: ["O círculo é a íris: um olhar atento.", "O A traz o ponto central, o foco de uma câmera."], lb: [["ÍRIS", "olhar sempre atento"], ["FOCO", "o ponto central do A"]],
   pal: [["Grafite", "#141312", "como base e elegância", "#f3efe6"], ["Champagne", "#c9ad72", "para destaque e detalhes", "#141312"], ["Bronze", "#8c7545", "para linhas e sombras", "#f3efe6"], ["Areia", "#f3efe6", "para fundos claros", "#141312"], ["Chumbo", "#2a2825", "para superfícies", "#f3efe6"]] }
};
function mk(d, c1, c2, s, anim) {
  const a = `width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true"`, R = anim ? "m-ring" : "", F = anim ? "m-fill" : "", ps = anim ? ' pathLength="1"' : "";
  const sa = anim ? "" : ' style="stroke-dasharray:none"';
  if (d.m === "a") return `<svg ${a}><circle class="${R}"${ps} cx="50" cy="50" r="46" fill="none" stroke="${c1}" stroke-width="4"/><path class="${F}" fill="${c1}" fill-rule="evenodd" d="${P_A}"/></svg>`;
  if (d.m === "shield") return `<svg ${a}><path class="${R}"${ps} d="${P_SH}" fill="none" stroke="${c1}" stroke-width="3"/><path class="${F}" d="${P_SH}" fill="${c1}"/><path class="${F}" transform="translate(20 20) scale(.6)" fill="${c2}" fill-rule="evenodd" d="${P_A}"/></svg>`;
  return `<svg ${a}><circle class="${R}"${ps} cx="50" cy="50" r="46" fill="none" stroke="${c1}" stroke-width="2.5"/><path class="${R}"${ps} d="M29 74L50 26L71 74" fill="none" stroke="${c1}" stroke-width="6"/><path class="${F}" d="M39 60H61" stroke="${c1}" stroke-width="5"/><circle class="${F}" cx="50" cy="45" r="3.6" fill="${c2}"/></svg>`;
}
const lock = (d, c1, c2, fg, v, ms, fs, anim) => `<div class="lock ${v ? "v" : ""}" style="color:${fg}">${mk(d, c1, c2, ms, anim)}<div class="wm" style="font-size:${fs}px"><b>ADVM</b><small>Technology</small></div></div>`;
const dkC = d => d.m === "shield" ? ["#0a1a2f", "#3d9bff"] : d.m === "iris" ? ["#8c7545", "#8c7545"] : ["#1a2012", "#1a2012"];

function pickVoice() {
  const vs = speechSynthesis.getVoices(); if (!vs.length) return;
  const pt = vs.filter(v => /^pt[-_]BR/i.test(v.lang) || /portugu[eê]s.*brasil|brazil/i.test(v.name));
  const rank = v => /google|natural|neural|online|luciana|francisca|antonio|thalita|microsoft/i.test(v.name) ? 0 : 1;

}

const player = new Audio(); player.preload = "auto";
function speak(text, my) {
  const fallback = () => sleep(Math.max(1700, text.split(/\s+/).length * 400), my);
  if (muted) return fallback();
  const src = AUDIO[text];
  if (src) return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; clearInterval(iv); player.onended = player.onerror = null; res(v); } };
    player.onended = () => fin(true); player.onerror = () => { fallback().then(fin); };
    player.src = src; const pr = player.play(); if (pr && pr.catch) pr.catch(() => { fallback().then(fin); });
    const iv = setInterval(() => { if (my !== token) { player.pause(); fin(false); } }, 80);
  });
  if (!ptVoice || !("speechSynthesis" in window)) return fallback();
  return new Promise(res => {
    let done = false, started = false; const u = new SpeechSynthesisUtterance(text);
    u.voice = ptVoice; u.lang = ptVoice.lang; u.rate = 1.06; u.pitch = 1;
    const fin = v => { if (!done) { done = true; clearInterval(iv); res(v); } };
    u.onstart = () => { started = true; }; u.onend = () => fin(true); u.onerror = () => { if (!started) fallback().then(fin); else fin(true); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(() => { if (!started && !done) { speechSynthesis.cancel(); fallback().then(fin); } }, 2500);
    const iv = setInterval(() => { if (my !== token) { speechSynthesis.cancel(); fin(false); } }, 80);
  });
}

/* áudio: whoosh + base ambiente */
function audioInit() {
  if (audioCtx) return; try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const g = audioCtx.createGain(); g.gain.value = .035; g.connect(audioCtx.destination);
  [55, 82.5, 110.4].forEach((f, i) => { const o = audioCtx.createOscillator(); o.type = i ? "sine" : "triangle"; o.frequency.value = f; const l = audioCtx.createGain(); l.gain.value = i ? .5 : 1; o.connect(l); l.connect(g); o.start(); });
  drone = g;
}
function whoosh() {
  if (!audioCtx || muted) return; const t = audioCtx.currentTime, len = audioCtx.sampleRate * .7, b = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = audioCtx.createBufferSource(); s.buffer = b; const f = audioCtx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3200, t + .6);
  const g = audioCtx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .15); g.gain.exponentialRampToValueAtTime(.0001, t + .7);
  s.connect(f); f.connect(g); g.connect(audioCtx.destination); s.start(t);
}
